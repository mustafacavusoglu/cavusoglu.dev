<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Resume – Mustafa Çavuşoğlu</title>
<meta name="description" content="Mustafa Çavuşoğlu's resume">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
<!-- Read-only view of the CV picked in /resume (⋯ → "cavusoglu.dev/cv'de göster"). The .paper styles and the
     size / "Tek sayfa" logic are copied from public/resume/index.html; keep the two in step. -->
<style>
:root{--bg:#fff;--ink:#111113;--body:#3f3f46;--muted:#6b6b73;--line:#e6e6e9;--soft:#f4f4f6;--desk:#e8eaed}
:root.dark{--bg:#0f0f11;--ink:#f2f2f3;--body:#c9c9cf;--muted:#8b8b93;--line:#26262b;--soft:#18181b;--desk:#1c1c20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--desk);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;border-bottom:1px solid var(--line);background:var(--bg)}
.icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:17px;text-decoration:none}
.icon:hover{background:var(--soft);color:var(--ink)}
.title{font-weight:600;font-size:15px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:500;background:var(--ink);color:var(--bg);text-decoration:none}
.view{padding:24px 16px calc(env(safe-area-inset-bottom) + 24px)}
.msg{text-align:center;color:var(--body);padding:48px 16px}

.paper{width:210mm;min-height:297mm;margin:0 auto;padding:1.5cm 1.8cm;background:#fff;color:#1a1a1a;box-shadow:0 1px 8px rgba(0,0,0,.12);font:10pt/1.35 "Helvetica Neue",Helvetica,Arial,sans-serif;transform-origin:top left}
.paper .flow{display:flow-root}
.paper .flow.tight{line-height:1.25}.paper .tight h2{margin:9px 0 4px}.paper .tight hr{margin:6px 0}
.paper .tight ul{margin:1px 0 4px}.paper .tight li{margin:0}.paper .tight p{margin:1px 0}
.paper h1{font-size:20pt;margin:0 0 2px;color:#111;letter-spacing:.3px}
.paper h2{font-size:11pt;color:#2c3e50;border-bottom:1.2px solid #3498db;padding-bottom:2px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.8px}
.paper h3{font-size:10.5pt;margin:0 0 2px;color:#222}
.paper p{margin:2px 0}
.paper ul{margin:2px 0 8px;padding-left:18px}
.paper li{margin-bottom:1px}
.paper a{color:#2980b9;text-decoration:none}
.paper strong{color:#111}
.paper hr{border:none;border-top:1px solid #ddd;margin:10px 0}
.paper em{color:#555;font-size:9.5pt}
.paper h2,.paper h3{break-after:avoid}
.paper li{break-inside:avoid}
@media (max-width:820px){.view{padding:12px 8px}}
@page{size:A4;margin:1.5cm 1.8cm}
@media print{
  html,body{background:#fff}
  header{display:none}
  .view{padding:0}
  .paper{width:auto;min-height:0;padding:0;box-shadow:none;zoom:1!important}
}
</style>
</head>
<body>
<header>
  <a class="icon" href="/" aria-label="Home">←</a>
  <span class="title">Resume</span>
  <span class="sp"></span>
  <a class="btn" id="pdf" href="/api/cv.pdf" download hidden>Download PDF</a>
  <button class="icon" id="theme" aria-label="Toggle theme">☾</button>
</header>
<main class="view" id="view"><p class="msg" id="msg">Loading…</p><article class="paper" id="paper" hidden></article></main>

<script>
const $ = id => document.getElementById(id)
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} },
}
function setTheme(dark) {
  document.documentElement.classList.toggle('dark', dark)
  $('theme').textContent = dark ? '☀' : '☾'
  document.querySelector('meta[name=theme-color]').content = dark ? '#0f0f11' : '#ffffff'
}
setTheme(store.get('cv-dark', false))
$('theme').onclick = () => { const d = !document.documentElement.classList.contains('dark'); store.set('cv-dark', d); setTheme(d) }

let cv = null
function fit() {
  const p = $('paper'), w = $('view').clientWidth - 16
  p.style.zoom = ''
  if (w > 0 && p.offsetWidth > w) p.style.zoom = w / p.offsetWidth
  onePage()
}
addEventListener('resize', () => cv && fit())

const MIN_SCALE = 0.88
function onePage() {
  const f = $('paper').querySelector('.flow'), base = cv.size || 100
  f.style.zoom = base / 100; f.classList.remove('tight')
  const pages = () => { const r = f.getBoundingClientRect(); return r.width ? r.height / r.width / (267 / 174) : 0 }
  if (!cv.fit || pages() <= 1) return
  let k = base
  f.classList.add('tight')
  while (k > MIN_SCALE * 100 && pages() > 0.99) f.style.zoom = (k -= 2) / 100
  if (pages() > 0.99) { f.style.zoom = base / 100; f.classList.remove('tight') }
}

fetch('/api/cv').then(r => r.ok ? r.json() : Promise.reject(r.status)).then(d => {
  cv = d
  const secs = d.md.match(/^## .*/gm) ?? []
  $('paper').lang = secs.length && secs.filter(h => /[çğıöşüİ]/i.test(h)).length * 2 >= secs.length ? 'tr' : 'en'
  $('paper').innerHTML = `<div class="flow">${marked.parse(d.md)}</div>`
  $('msg').hidden = true; $('paper').hidden = false; $('pdf').hidden = false
  fit()
  if (location.hash === '#print') { history.replaceState(null, '', '/cv/'); setTimeout(print, 300) } // PDF fallback, see cvPdf in the worker
}).catch(s => { $('msg').textContent = s === 404 ? 'No resume published yet.' : 'Could not load the resume. Try again later.' })

addEventListener('beforeprint', () => { if (cv) document.title = cv.name })
</script>
</body>
</html>
