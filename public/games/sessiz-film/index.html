<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sessiz Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#111113;--body:#3f3f46;--muted:#6b6b73;--line:#e6e6e9;--soft:#f4f4f6;--key:#ececef;--accent:#1f4fd1;--ok:#15803d;--bad:#c2410c}
:root.dark{--bg:#0f0f11;--ink:#f2f2f3;--body:#c9c9cf;--muted:#8b8b93;--line:#26262b;--soft:#18181b;--key:#232328;--accent:#7aa2ff;--ok:#4ade80;--bad:#fb923c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:disabled{opacity:.35;cursor:default}
[hidden]{display:none!important}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.muted{color:var(--muted)}
.app{max-width:500px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px)}
header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
header b{text-align:center;font-weight:600;letter-spacing:-.01em}
.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:18px;text-decoration:none}
.icon:hover{background:var(--soft);color:var(--ink)}
section{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px 10px;text-align:center}
.btn{width:100%;height:56px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:500;font-size:17px}
.btn:active{opacity:.85}

/* start + end */
h1{font-size:34px;font-weight:600;letter-spacing:-.03em;margin:0 0 8px}
.lead{color:var(--body);margin:0 0 26px;max-width:340px}
.demo{font-size:24px!important;margin:0 0 10px!important}
.seg{display:flex;width:100%;max-width:300px;padding:4px;margin:0 0 30px;border-radius:12px;background:var(--soft)}
.seg button{flex:1;height:38px;border-radius:9px;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.rules div{background:var(--soft);border-radius:14px;padding:14px 6px}
.rules b{display:block;font-size:22px;font-weight:600}
.rules span{font-size:12px;color:var(--muted)}
.foot{padding:8px 2px 0}
.foot p{margin:10px 0 0;text-align:center;font-size:13px}
.big{font-size:56px;font-weight:600;letter-spacing:-.04em;line-height:1}
#list{list-style:none;padding:0;margin:20px 0 0;width:100%;text-align:left}
#list li{display:flex;justify-content:space-between;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:15px}
#list li span:last-child{color:var(--muted);flex:none}

/* play */
.meta{display:flex;align-items:center;gap:14px;padding:2px 2px 8px 6px;font-size:13px}
.meta .score{font-weight:500;margin-right:auto}
.skip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.skip:hover{color:var(--ink)}
.track{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 6px}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.tag{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pz{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 20px;margin:16px 0 18px;font:500 clamp(22px,7vw,34px)/1 "IBM Plex Mono",ui-monospace,monospace}
.pz .w{display:inline-flex;align-items:flex-end;gap:.14em;white-space:nowrap}
.pz i{font-style:normal;display:inline-block;width:.8em;height:1.15em;padding-bottom:.1em;text-align:center;border-bottom:.08em solid var(--muted)}
.pz i.p{width:auto;border:0}
.pz .v{color:var(--accent)}
.pz .x{color:var(--bad)}
.hearts{display:flex;gap:6px;justify-content:center}
.hearts i{width:9px;height:9px;border-radius:50%;background:var(--ink);transition:background .2s}
.hearts i.off{background:var(--line)}
.pz i.b{position:relative;cursor:pointer;border-bottom-color:var(--ink)}
.pz i.b::before{content:'';position:absolute;inset:-10px -3px}
.pz i.on{border-bottom-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:5px 5px 0 0}
.pz i.on:empty::after{content:'';display:inline-block;width:2px;height:.8em;margin-top:.2em;background:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#msg{min-height:24px;margin:10px 0 0;font-size:15px}
#msg.ok{color:var(--ok)}
#msg.bad{color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* keyboard */
.kb{padding:6px 0 0}
.kr{display:flex;gap:6px;margin-top:7px}
.kr .sp{flex:.5}
.key{flex:1;height:52px;border-radius:10px;background:var(--key);font-weight:500;font-size:22px;display:grid;place-items:center}
.key.vow{height:60px;font:500 24px "IBM Plex Mono",monospace}
.key:active{background:var(--line);transform:scale(.96)}
.key.hint{flex:1.6;font-size:14px;line-height:1.1;align-content:center}
.key.hint small{font-size:11px;color:var(--muted);font-weight:400}
.key.go{flex:1.8;background:var(--ink);color:var(--bg);font-size:15px}
.desk{display:none}
@media (hover:hover) and (pointer:fine){
  .desk{display:block}
  .key:hover{filter:brightness(.96)}
  :root.dark .key:hover{filter:brightness(1.2)}
}
@media (max-height:640px){.key,.key.vow{height:48px}#puzzle{margin:8px 0 12px}}

.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.4}
.pair{display:flex;gap:8px;margin-top:8px}
.pair .btn{height:50px;font-size:16px}
.note{color:var(--bad)!important}
.link{display:block;margin:12px auto 0;color:var(--muted);font-size:14px;padding:4px 10px}
.link:hover{color:var(--ink)}
h2{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 20px}
.field{width:100%;text-align:left;margin-bottom:14px}
.field span{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 2px}
.field input{width:100%;height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:500 17px "IBM Plex Sans",sans-serif;outline:none}
.field input:focus{border-color:var(--accent);background:var(--bg)}
#jcode{font-family:"IBM Plex Mono",monospace;letter-spacing:.3em;text-transform:uppercase}
.code{font:500 46px/1 "IBM Plex Mono",monospace;letter-spacing:.18em;margin:6px 0 12px;padding-left:.18em}
.share{height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--body)}
#players{list-style:none;padding:0;margin:26px 0 0;width:100%;text-align:left}
#players li{display:flex;justify-content:space-between;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line)}
#players li:first-child{border-top:1px solid var(--line)}
#players small{color:var(--muted);font-size:12px}
#players li.empty{color:var(--line)}
.timer{font-weight:600;min-width:28px;text-align:right}
.timer.low,.track.low i{color:var(--bad);background:var(--bad)}
.timer.low{background:none}
.board{display:flex;flex-wrap:wrap;gap:6px;padding:10px 4px 0}
.board span{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--body)}
.board span.me{background:var(--ink);color:var(--bg)}
#wait{text-align:center;color:var(--muted);font-size:14px;margin:0;padding:18px 0}
#list li.me{font-weight:600}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="icon" href="/games/" aria-label="Oyunlara dön">←</a>
    <b>Sessiz Film</b>
    <button class="icon" id="theme" aria-label="Temayı değiştir">☾</button>
  </header>

  <section id="start">
    <div class="stage">
      <div class="seg" id="cat" role="tablist"><button data-c="genel">Genel</button><button data-c="tr">Türkçe</button></div>
      <div class="pz demo" id="demo"></div>
      <p class="tag" id="demotag" style="margin:0 0 28px"></p>
      <h1>Sesli harfler gitti.</h1>
      <p class="lead" id="lead"></p>
      <div class="rules">
        <div><b>10</b><span>film her turda</span></div>
        <div><b>3</b><span>hak her filmde</span></div>
        <div><b>1–4</b><span>harf alma, ada göre</span></div>
      </div>
    </div>
    <div class="foot">
      <button class="btn" id="go">Tek başına oyna</button>
      <div class="pair">
        <button class="btn ghost" id="mk">Oda kur</button>
        <button class="btn ghost" id="jn">Odaya katıl</button>
      </div>
      <p class="muted" id="best">Odada 2–5 kişi yarışır, ilk bilen kazanır.</p>
    </div>
  </section>

  <section id="online" hidden>
    <form class="stage" id="oform" style="justify-content:flex-start;padding-top:36px" autocomplete="off">
      <h2 id="otitle"></h2>
      <label class="field"><span>Adın</span><input id="name" maxlength="16" placeholder="Oyuncu" enterkeyhint="go"></label>
      <label class="field" id="jfield"><span>Oda kodu</span><input id="jcode" maxlength="6" placeholder="ABCDE" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go"></label>
    </form>
    <div class="foot">
      <button class="btn" id="ogo" form="oform"></button>
      <button class="link" id="oback">Vazgeç</button>
    </div>
  </section>

  <section id="lobby" hidden>
    <div class="stage" style="justify-content:flex-start;padding-top:30px">
      <p class="tag" style="margin:0">Oda kodu</p>
      <div class="code" id="code"></div>
      <button class="share" id="share">Davet linkini paylaş</button>
      <ul id="players"></ul>
      <p class="muted" id="lnote" style="margin:16px 0 0;font-size:14px"></p>
    </div>
    <div class="foot">
      <button class="btn" id="race">Yarışı başlat</button>
      <button class="link" id="lexit">Odadan çık</button>
    </div>
  </section>

  <section id="play" hidden>
    <div class="meta mono">
      <span id="pos"></span>
      <span class="score" id="score"></span>
      <span class="timer" id="timer" hidden></span>
      <button class="skip" id="skip">Pas geç</button>
    </div>
    <div class="track" id="track"><i id="prog"></i></div>
    <div class="board" id="board" hidden></div>
    <div class="stage">
      <div class="tag" id="tag"></div>
      <div class="pz" id="puzzle"></div>
      <div class="hearts" id="hearts" aria-label="Kalan hak"></div>
      <p id="msg" aria-live="polite"></p>
      <p class="desk muted" id="keyhelp" style="font-size:12px;margin:2px 0 0"></p>
    </div>
    <div class="kb" id="kb"></div>
    <div class="foot" id="after" hidden>
      <button class="btn" id="next">Sonraki film →</button>
      <p id="wait"></p>
    </div>
  </section>

  <section id="end" hidden>
    <div class="stage" style="justify-content:flex-start;padding-top:28px">
      <div class="big" id="total"></div>
      <p class="muted mono" id="endbest" style="margin:10px 0 0;font-size:14px"></p>
      <ul id="list"></ul>
    </div>
    <div class="foot">
      <button class="btn" id="again">Tekrar oyna</button>
      <button class="link" id="eexit" hidden>Odadan çık</button>
    </div>
  </section>
</div>

}

// Theme: light by default, the choice is remembered.
function setTheme(dark) {

  $('theme').textContent = dark ? '☀' : '☾'

}

$('theme').onclick = () => { const d = !document.documentElement.classList.contains('dark'); store.set('sf-dark', d); setTheme(d) }

let round, idx, total, results, cur

// Prefer films not seen in earlier rounds; start over when too few are left.
function pickRound(list) {
  const seen = new Set(store.get('sf-seen', []))
  let pool = list.filter(f => !seen.has(f.t))
  if (pool.length < ROUND) { for (const f of list) seen.delete(f.t); pool = list.slice() }
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [pool[i], pool[j]] = [pool[j], pool[i]] }
  const r = pool.slice(0, ROUND)
  r.forEach(f => seen.add(f.t))
  store.set('sf-seen', [...seen])
  return r
}

function show(id) { for (const s of ['start', 'online', 'lobby', 'play', 'end']) $(s).hidden = s !== id }

function start() {
  round = pickRound(LISTS[cat]); idx = 0; total = 0; results = []
  show('play'); load(round[idx])
}

function load(f) {
  // Turkish titles keep İ/I, Ö, Ü; others go plain A–Z (Léon → LEON), so every blank is a pad key.
  const chars = [...(f.tr ? f.t.toLocaleUpperCase('tr-TR') : f.t.normalize('NFD').replace(/\p{M}/gu, '').toUpperCase())]
  const pad = f.tr ? 'AEIİOÖUÜ' : 'AEIOU'
  $('vow').innerHTML = [...pad].map(k => `<button class="key vow" data-k="${k}">${k}</button>`).join('')
  const vowels = chars.map((c, i) => isVowel(c) ? i : -1).filter(i => i >= 0)
  const letters = chars.filter(c => /\p{L}/u.test(c)).length
  // One letter per ~7 letters of title, at least one, but never every vowel.
  const hints = Math.min(vowels.length - 1, Math.max(1, Math.round(letters / 7)))
  // Race time: 8 s plus one per letter, 10–30 s.
  const dur = Math.max(10, Math.min(30, 8 + letters))
  cur = { f, chars, vowels, hints, dur, used: 0, wrong: 0, pad, shown: new Set(), fill: {}, at: vowels[0], done: false }
  $('kb').hidden = false
  $('after').hidden = true
  $('timer').classList.remove('low')
  $('track').classList.remove('low')
  $('keyhelp').textContent = 'A E I O U ile doldur · ← → gez · Enter tahmin' + (NET ? '' : ' · Esc pas')
  msg('')
  render()
}

function render() {
  const s = cur
  const live = !s.done && !s.out && !s.sent
  $('puzzle').innerHTML = slots(s.chars, i => s.shown.has(i) ? ['v', s.chars[i]] : s.done ? [s.won ? 'v' : 'x', s.chars[i]]
    : [live && i === s.at ? 'on' : '', s.fill[i] || ''])
  $('tag').textContent = `${s.f.y} · ${s.chars.filter(isChar).length} harf`
  $('pos').textContent = `${(NET ? S.idx : idx) + 1}/${ROUND}`
  $('score').textContent = `${NET ? S.players[NET.id]?.score ?? 0 : total} puan`
  $('board').hidden = !NET
  $('timer').hidden = !NET || s.done
  $('skip').hidden = !!NET || s.done
  if (NET) {
    $('board').innerHTML = ranking().map(([id, p]) => `<span class="${+id === NET.id ? 'me' : ''}">${esc(p.name)} ${p.score}</span>`).join('')
    if (s.done) $('prog').style.width = '0'
  } else $('prog').style.width = `${(idx + s.done) / ROUND * 100}%`
  $('hearts').innerHTML = Array.from({ length: LIVES }, (_, i) => `<i class="${i < LIVES - s.wrong ? '' : 'off'}"></i>`).join('')
  const left = s.hints - s.used
  $('hint').innerHTML = `Harf al<small>${left} hak</small>`
  $('hint').disabled = left <= 0
}

// Every letter sits on its own underline so the length shows. Vowels are blanks: cell(i) gives [class, letter].
const isChar = c => /[\p{L}\p{N}]/u.test(c)
function slots(chars, cell) {
  return '<span class="w">' + chars.map((c, i) => {
    if (c === ' ') return '</span><span class="w">'
    if (!isChar(c)) return `<i class="p">${esc(c)}</i>`
    if (!isVowel(c)) return `<i>${c}</i>`
    const [cls, ch] = cell(i)
    return `<i class="b ${cls}" data-i="${i}">${ch}</i>`
  }).join('') + '</span>'
}

// Blanks you can still fill (hint letters are locked), and moving the cursor between them.
const blanks = () => cur.vowels.filter(i => !cur.shown.has(i))
function move(d) { const b = blanks(); cur.at = b[Math.max(0, Math.min(b.length - 1, b.indexOf(cur.at) + d))] }
function put(v) {
  if (cur.at == null) return
  cur.fill[cur.at] = v
  // Jump to the next empty blank; when all are full, just step right.
  const b = blanks(), k = b.indexOf(cur.at)
  const empty = [...b.slice(k + 1), ...b.slice(0, k)].find(i => !cur.fill[i])
  if (empty != null) cur.at = empty; else move(1)
}
function back() {
  if (!cur.fill[cur.at]) move(-1)
  delete cur.fill[cur.at]
}
function msg(t, cls = '') { $('msg').textContent = t; $('msg').className = cls }
const points = () => Math.max(10, 100 - 20 * cur.used - 25 * cur.wrong)

function guess() {
  const b = blanks()
  if (b.some(i => !cur.fill[i])) return msg('Önce tüm boşlukları doldur', 'bad')
  if (b.every(i => cur.fill[i] === cur.chars[i])) {
    if (!NET) return finish(true)
    // Race: the host decides who was first.
    cur.sent = true
    $('kb').hidden = true
    msg('Doğru! Sonuç bekleniyor…', 'ok')
    return NET.host ? got(NET.id, S.idx, points()) : send({ t: 'got', i: S.idx, pts: points() })
  }
  cur.wrong++
  const a = $('puzzle')
  a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake')
  if (cur.wrong >= LIVES) {
    if (!NET) return finish(false)
    cur.out = true
    $('kb').hidden = true
    msg('Hakların bitti · diğerlerini bekle', 'bad')
  } else msg(`Olmadı · ${LIVES - cur.wrong} hakkın kaldı`, 'bad')
  render()
}

function hint() {
  // Reveal an empty or wrong blank, never one you already got right (unless that's all that's left).
  const open = blanks(), miss = open.filter(i => cur.fill[i] !== cur.chars[i]), pool = miss.length ? miss : open
  if (cur.used >= cur.hints || !pool.length) return
  const i = pool[Math.random() * pool.length | 0]
  cur.shown.add(i)
  delete cur.fill[i]
  cur.used++
  if (cur.at === i) cur.at = blanks().find(j => !cur.fill[j]) ?? blanks()[0]
  render()
}

// Solo only: a race film ends when the host says so.
function finish(won) {
  const s = cur
  s.done = true; s.won = won
  const pts = won ? points() : 0
  total += pts
  results.push({ t: s.f.t, pts })
  $('kb').hidden = true
  $('after').hidden = $('next').hidden = false
  $('wait').hidden = true
  $('next').textContent = idx + 1 < ROUND ? 'Sonraki film →' : 'Sonucu gör →'
  msg(won ? `Bildin · +${pts} puan` : 'Bu sefer olmadı', won ? 'ok' : 'bad')
  render()
}

function next() { if (++idx < ROUND) load(round[idx]); else end() }

function press(k) {
  if (!cur || cur.done || cur.out || cur.sent) return
  if (k === 'enter') return guess()
  if (k === 'hint') return hint()
  if (k === 'skip') return NET || finish(false)
  if (k === 'back') back()
  else if (k === 'left') move(-1)
  else if (k === 'right') move(1)
  else if (cur.pad.includes(k = cur.f.tr ? k.toLocaleUpperCase('tr-TR') : k.toUpperCase()) && k.length === 1) put(k)
  else return
  render()
}

$('kb').onclick = e => { const b = e.target.closest('[data-k]'); if (b && !b.disabled) press(b.dataset.k) }
$('skip').onclick = () => press('skip')
$('puzzle').onclick = e => {
  const t = e.target.closest('[data-i]')
  if (!t || cur.done || cur.out || cur.sent || cur.shown.has(+t.dataset.i)) return
  cur.at = +t.dataset.i
  render()
}
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || $('play').hidden || !cur) return
  if (cur.done) { if (e.key === 'Enter' && !NET) { e.preventDefault(); next() } return }
  const k = e.key === 'Enter' ? 'enter' : e.key === 'Backspace' ? 'back' : e.key === 'Escape' ? 'skip' : e.key === 'ArrowLeft' ? 'left' : e.key === 'ArrowRight' ? 'right' : e.key.length === 1 ? e.key : null
  if (k) { e.preventDefault(); press(k) }
})

function end() {
  const best = Math.max(store.get('sf-best', 0), total)
  store.set('sf-best', best)
  $('total').textContent = `${total}`
  $('endbest').textContent = `puan · ${results.filter(r => r.pts).length}/${ROUND} film · en iyi ${best}`
  $('list').innerHTML = results.map(r => `<li><span>${r.pts ? '✓' : '✗'} ${esc(r.t)}</span><span class="mono">${r.pts ? '+' + r.pts : '—'}</span></li>`).join('')
  $('again').textContent = 'Tekrar oyna'
  $('again').disabled = false
  $('eexit').hidden = true
  show('end')
}

// ================= rooms =================
// /api/room/<code> is a Durable Object that relays JSON between up to 5 players (worker/index.js).
// The lowest player id is the host: it owns the race state S, runs the clock, decides who was
// first and broadcasts S on every change. Everyone renders from S. When the host leaves, the next
// one takes over with the S it already has.
// ponytail: answers live in the page, so a player could cheat from devtools; fine among friends.
let NET = null, S = null
const H = {} // host-only clocks: endsAt, nextAt
let endsAt = 0 // local countdown for the current film
const ranking = () => Object.entries(S.players).sort((a, b) => b[1].score - a[1].score)

function send(m) { if (NET?.ws.readyState === 1) NET.ws.send(JSON.stringify(m)) }

function online(create) {
  $('otitle').textContent = create ? 'Oda kur' : 'Odaya katıl'
  $('ogo').textContent = create ? 'Odayı kur' : 'Katıl'
  $('jfield').hidden = create
  $('name').value = store.get('sf-name', '')
  $('oform').dataset.create = create ? '1' : ''
  show('online')
  ;(create || $('jcode').value ? $('name') : $('jcode')).focus()
}

$('oform').onsubmit = e => {
  e.preventDefault()
  const name = $('name').value.trim().slice(0, 16) || 'Oyuncu'
  store.set('sf-name', name)
  const create = !!$('oform').dataset.create
  const code = create ? Array.from({ length: 5 }, () => 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random() * 31 | 0]).join('')
    : $('jcode').value.toUpperCase().replace(/[^A-Z0-9]/g, '')
  if (!/^[A-Z0-9]{4,6}$/.test(code)) { $('jcode').focus(); return }
  connect(code, create, name)
}

function connect(code, create, name) {
  // SF prefix keeps these rooms apart from Hayatta Kal's.
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/room/SF${code}?max=${MAXP}`)
  NET = { ws, code, create, name, id: 0, host: false }
  S = null
  history.replaceState(null, '', '#' + code)
  $('code').textContent = code
  $('players').innerHTML = ''
  $('lnote').textContent = 'Bağlanıyor…'
  $('race').hidden = true
  show('lobby')
  ws.onmessage = e => { if (NET?.ws === ws) onNet(JSON.parse(e.data)) }
  ws.onclose = () => { if (NET?.ws === ws) leave('Bağlantı koptu.') }
}

function leave(why) {
  const n = NET
  NET = S = null
  if (n) try { n.ws.close() } catch {}
  history.replaceState(null, '', location.pathname)
  $('best').textContent = why || 'Odada 2–5 kişi yarışır, ilk bilen kazanır.'
  $('best').classList.toggle('note', !!why)
  show('start')
}

function onNet(m) {
  switch (m.t) {
    case 'full': return leave(`Oda dolu (en fazla ${MAXP} kişi).`)
    case 'hello':
      NET.id = m.id
      NET.host = m.host === m.id
      if (NET.host && !NET.create) return leave(`${NET.code} diye bir oda yok.`)
      if (NET.host) { S = { phase: 'lobby', players: {}, host: NET.id }; hi(NET.id, NET.name) }
      else send({ t: 'hi', name: NET.name })
      break
    case 'hi': if (NET.host) hi(m.from, m.name); break
    case 'got': if (NET.host) got(m.from, m.i, m.pts); break
    case 'S': applyS(m.s); break
    case 'leave':
      if (m.host === NET.id && !NET.host && S) { NET.host = true; H.endsAt = endsAt; H.nextAt = Date.now() + 4000 }
      if (NET.host && S) { delete S.players[m.id]; S.host = NET.id; push() }
      break
  }
}

// ---- host ----
function push() {
  const s = { ...S, left: Math.max(0, (H.endsAt || 0) - Date.now()) }
  send({ t: 'S', s })
  applyS(s)
}
function hi(id, name) {
  S.players[id] = { name: String(name || 'Oyuncu').slice(0, 16), score: S.players[id]?.score ?? 0 }
  push()
}
function got(from, i, pts) {
  if (S.phase !== 'film' || i !== S.idx || !S.players[from]) return
  S.winner = from
  S.pts = Math.max(10, Math.min(100, pts | 0))
  S.players[from].score += S.pts
  resolve()
}
function resolve() { S.phase = 'res'; H.nextAt = Date.now() + 4000; push() }
function race() {
  if (!NET?.host || Object.keys(S.players).length < 2) return
  S.cat = cat
  S.round = pickRound(LISTS[cat]).map(f => LISTS[cat].indexOf(f))
  S.idx = 0
  S.game = (S.game || 0) + 1
  for (const p of Object.values(S.players)) p.score = 0
  beginFilm()
}
function beginFilm() {
  load(LISTS[S.cat][S.round[S.idx]]) // sets cur.dur
  cur.key = `${S.game}:${S.idx}`
  H.endsAt = Date.now() + cur.dur * 1000
  S.phase = 'film'; S.winner = null; S.pts = 0
  push()
}
function hostTick() {
  const now = Date.now()
  if (S.phase === 'film' && now >= H.endsAt) { S.winner = null; resolve() }
  else if (S.phase === 'res' && now >= H.nextAt) { if (++S.idx < ROUND) beginFilm(); else { S.phase = 'end'; push() } }
}

// ---- everyone ----
function applyS(s) {
  S = s
  if (s.phase === 'lobby') return renderLobby()
  if (s.phase === 'end') return raceEnd()
  const key = `${s.game}:${s.idx}`
  if (!cur || cur.key !== key) { load(LISTS[s.cat][s.round[s.idx]]); cur.key = key }
  show('play')
  if (s.phase === 'film') endsAt = Date.now() + s.left
  else if (!cur.done) {
    cur.done = true
    cur.won = s.winner != null
    const w = s.players[s.winner]
    msg(s.winner == null ? 'Süre doldu · kimse bilemedi' : s.winner === NET.id ? `Sen bildin · +${s.pts}` : `${w?.name ?? 'Biri'} bildi · +${s.pts}`,
      s.winner === NET.id ? 'ok' : 'bad')
    $('kb').hidden = $('next').hidden = true
    $('after').hidden = $('wait').hidden = false
    $('wait').textContent = s.idx + 1 < ROUND ? 'Sonraki film geliyor…' : 'Sonuçlar geliyor…'
  }
  render()
}

function renderLobby() {
  show('lobby')
  const ps = Object.entries(S.players)
  $('players').innerHTML = ps.map(([id, p]) => `<li><span>${esc(p.name)}</span><small>${[+id === S.host && 'kurucu', +id === NET.id && 'sen'].filter(Boolean).join(' · ')}</small></li>`).join('')
    + '<li class="empty">—</li>'.repeat(MAXP - ps.length)
  $('race').hidden = !NET.host
  $('race').disabled = ps.length < 2
  $('lnote').textContent = (!NET.host ? 'Kurucunun yarışı başlatması bekleniyor…'
    : ps.length < 2 ? 'En az 2 oyuncu gerekli · kodu paylaş' : `${ps.length} oyuncu hazır`) + (NET.host ? ` · ${cat === 'tr' ? 'Türkçe' : 'Genel'} filmler` : '')
}

function raceEnd() {
  const r = ranking()
  const me = r.findIndex(([id]) => +id === NET.id) + 1
  $('total').textContent = `${me}.`
  const tie = r.length > 1 && r[1][1].score === r[0][1].score
  $('endbest').textContent = tie ? `Berabere · ${r[0][1].score} puan` : `${r[0][1].name} kazandı · ${r[0][1].score} puan`
  $('list').innerHTML = r.map(([id, p], i) => `<li class="${+id === NET.id ? 'me' : ''}"><span>${i + 1}. ${esc(p.name)}</span><span class="mono">${p.score}</span></li>`).join('')
  $('again').textContent = NET.host ? 'Yeni tur' : 'Kurucu yeni turu başlatabilir'
  $('again').disabled = !NET.host || r.length < 2
  $('eexit').hidden = false
  show('end')
}

setInterval(() => {
  if (!NET || !S) return
  if (NET.host) hostTick()
  if (S.phase !== 'film' || !cur) return
  const ms = Math.max(0, endsAt - Date.now()), low = ms < 5000
  $('timer').textContent = `${Math.ceil(ms / 1000)} sn`
  $('timer').classList.toggle('low', low)
  $('track').classList.toggle('low', low)
  $('prog').style.width = `${ms / (cur.dur * 10)}%`
}, 200)

$('share').onclick = async () => {
  const url = `${location.origin}${location.pathname}#${NET.code}`
  try { if (navigator.share) return await navigator.share({ title: 'Sessiz Film', text: `Sessiz Film odama gel: ${NET.code}`, url }) } catch { return }
  try { await navigator.clipboard.writeText(url); $('share').textContent = 'Link kopyalandı' } catch { $('share').textContent = url }
}

const best = store.get('sf-best', 0)
if (best) $('best').textContent = `Tek başına en iyi skorun ${best} / ${ROUND * 100}`
function setCat(c) {
  cat = c
  store.set('sf-cat', c)
  for (const b of $('cat').children) b.classList.toggle('on', b.dataset.c === c)
  const [t, y, i] = c === 'tr' ? ['BABAM VE OĞLUM', 'Babam ve Oğlum · 2005', 1] : ['THE GODFATHER', 'The Godfather · 1972', 8]
  $('demo').innerHTML = slots([...t], j => j === i ? ['v', t[j]] : ['', ''])
  $('demotag').textContent = y
  $('lead').textContent = (c === 'tr' ? "Yeşilçam'dan bugüne Türk filmleri" : "IMDb Top 250'den filmler") + ', sesli harfleri silinmiş. Boşluklara sesli harfleri koy, filmi bul.'
}
setCat(cat)
$('cat').onclick = e => { const b = e.target.closest('[data-c]'); if (b) setCat(b.dataset.c) }
$('go').onclick = start
$('mk').onclick = () => online(true)
$('jn').onclick = () => online(false)
$('oback').onclick = () => show('start')
$('race').onclick = race
$('lexit').onclick = $('eexit').onclick = () => leave()
$('again').onclick = () => NET ? race() : start()
$('next').onclick = next
// Invite links: /games/sessiz-film/#CODE opens the join form.
const inv = location.hash.slice(1).toUpperCase()
if (/^[A-Z0-9]{4,6}$/.test(inv)) { $('jcode').value = inv; online(false) }
</script>
</body>
</html>
