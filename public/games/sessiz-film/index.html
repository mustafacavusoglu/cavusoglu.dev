<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sessiz Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#111113;--body:#3f3f46;--muted:#6b6b73;--line:#e6e6e9;--soft:#f4f4f6;--key:#ececef;--accent:#1f4fd1;--ok:#15803d;--bad:#c2410c}
:root.dark{--bg:#0f0f11;--ink:#f2f2f3;--body:#c9c9cf;--muted:#8b8b93;--line:#26262b;--soft:#18181b;--key:#232328;--accent:#7aa2ff;--ok:#4ade80;--bad:#fb923c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:disabled{opacity:.35;cursor:default}
[hidden]{display:none!important}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.muted{color:var(--muted)}
.app{max-width:500px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px)}
header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
header b{text-align:center;font-weight:600;letter-spacing:-.01em}
.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:18px;text-decoration:none}
.icon:hover{background:var(--soft);color:var(--ink)}
section{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px 10px;text-align:center}
.btn{width:100%;height:56px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:500;font-size:17px}
.btn:active{opacity:.85}

/* start + end */
h1{font-size:34px;font-weight:600;letter-spacing:-.03em;margin:0 0 8px}
.lead{color:var(--body);margin:0 0 26px;max-width:340px}
.demo{font:500 30px/1.2 "IBM Plex Mono",monospace;letter-spacing:.08em;margin-bottom:6px}
.demo span{color:var(--accent)}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.rules div{background:var(--soft);border-radius:14px;padding:14px 6px}
.rules b{display:block;font-size:22px;font-weight:600}
.rules span{font-size:12px;color:var(--muted)}
.foot{padding:8px 2px 0}
.foot p{margin:10px 0 0;text-align:center;font-size:13px}
.big{font-size:56px;font-weight:600;letter-spacing:-.04em;line-height:1}
#list{list-style:none;padding:0;margin:20px 0 0;width:100%;text-align:left}
#list li{display:flex;justify-content:space-between;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:15px}
#list li span:last-child{color:var(--muted);flex:none}

/* play */
.meta{display:flex;align-items:center;gap:14px;padding:2px 2px 8px 6px;font-size:13px}
.meta .score{font-weight:500;margin-right:auto}
.skip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.skip:hover{color:var(--ink)}
.track{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 6px}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.tag{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
#puzzle{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 20px;margin:14px 0 16px;font:500 clamp(26px,8.4vw,38px)/1.2 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.07em}
#puzzle .w{white-space:nowrap}
#puzzle .v{color:var(--accent)}
#puzzle .x{color:var(--bad)}
.hearts{display:flex;gap:6px;justify-content:center}
.hearts i{width:9px;height:9px;border-radius:50%;background:var(--ink);transition:background .2s}
.hearts i.off{background:var(--line)}
#answer{width:100%;min-height:54px;margin-top:22px;padding:0 8px;display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--line);font:500 20px/1.3 "IBM Plex Mono",monospace;letter-spacing:.04em;word-break:break-word}
#answer::after{content:'';width:2px;height:22px;margin-left:2px;background:var(--accent);animation:blink 1s steps(1) infinite}
#answer:empty::before{content:'Tahminini yaz';order:1;color:var(--muted);font-family:"IBM Plex Sans",sans-serif;letter-spacing:0;font-weight:400}
#answer:empty::after{margin:0 2px 0 0}
@keyframes blink{50%{opacity:0}}
#msg{min-height:24px;margin:10px 0 0;font-size:15px}
#msg.ok{color:var(--ok)}
#msg.bad{color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* keyboard */
.kb{padding:6px 0 0}
.kr{display:flex;gap:6px;margin-top:7px}
.kr .sp{flex:.5}
.key{flex:1;height:54px;border-radius:9px;background:var(--key);font-weight:500;font-size:18px;display:grid;place-items:center}
.key:active{background:var(--line);transform:scale(.96)}
.key.wide{flex:1.5;font-size:20px}
.key.hint{flex:1.6;font-size:14px;line-height:1.1;align-content:center}
.key.hint small{font-size:11px;color:var(--muted);font-weight:400}
.key.space{flex:2.2;font-size:13px;color:var(--muted)}
.key.go{flex:1.6;background:var(--ink);color:var(--bg);font-size:15px}
.desk{display:none}
@media (hover:hover) and (pointer:fine){
  .desk{display:block}
  .key:hover{filter:brightness(.96)}
  :root.dark .key:hover{filter:brightness(1.2)}
}
@media (max-height:640px){.key{height:46px}#answer{margin-top:14px}#puzzle{margin:8px 0 10px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="icon" href="/games/" aria-label="Oyunlara dön">←</a>
    <b>Sessiz Film</b>
    <button class="icon" id="theme" aria-label="Temayı değiştir">☾</button>
  </header>

  <section id="start">
    <div class="stage">
      <div class="demo">TH GDF<span>A</span>THR</div>
      <p class="tag" style="margin:0 0 28px">The Godfather · 1972</p>
      <h1>Sesli harfler gitti.</h1>
      <p class="lead">IMDb Top 250'den filmler, sadece sessiz harfleriyle. Kalanlardan filmi bul.</p>
      <div class="rules">
        <div><b>10</b><span>film her turda</span></div>
        <div><b>3</b><span>hak her filmde</span></div>
        <div><b>1–4</b><span>harf alma, ada göre</span></div>
      </div>
    </div>
    <div class="foot">
      <button class="btn" id="go">Başla</button>
      <p class="muted" id="best">Film başına 100 puan · harf −20 · yanlış −25</p>
    </div>
  </section>

  <section id="play" hidden>
    <div class="meta mono">
      <span id="pos"></span>
      <span class="score" id="score"></span>
      <button class="skip" id="skip">Pas geç</button>
    </div>
    <div class="track"><i id="prog"></i></div>
    <div class="stage">
      <div class="tag" id="tag"></div>
      <div id="puzzle"></div>
      <div class="hearts" id="hearts" aria-label="Kalan hak"></div>
      <div id="answer" aria-live="polite"></div>
      <p id="msg" aria-live="polite"></p>
      <p class="desk muted" style="font-size:12px;margin:2px 0 0">Klavyeden yazabilirsin · Enter tahmin · Esc pas</p>
    </div>
    <div class="kb" id="kb"></div>
    <div class="foot" id="after" hidden>
      <button class="btn" id="next">Sonraki film →</button>
    </div>
  </section>

  <section id="end" hidden>
    <div class="stage" style="justify-content:flex-start;padding-top:28px">
      <div class="big" id="total"></div>
      <p class="muted mono" id="endbest" style="margin:10px 0 0;font-size:14px"></p>
      <ul id="list"></ul>
    </div>
    <div class="foot">
      <button class="btn" id="again">Tekrar oyna</button>
    </div>
  </section>
</div>

<script>
// IMDb Top 250 films (year|title).
const FILMS = `
1994|The Shawshank Redemption

1975|Jaws
1982|Blade Runner
1980|Raging Bull
1974|Chinatown
1963|The Great Escape
1961|Yojimbo
1950|Rashomon
1957|Wild Strawberries
1957|The Seventh Seal
1948|The Treasure of the Sierra Madre
1959|Some Like It Hot

2016|Dangal

2019|Klaus
2021|Spider-Man: No Way Home

2024|Dune: Part Two
1993|Groundhog Day

1988|My Neighbor Totoro
1975|Monty Python and the Holy Grail

1927|Metropolis

1980|The Elephant Man
1982|The Thing
1989|Indiana Jones and the Last Crusade
`.trim().split('\n').map(l => ({ y: l.slice(0, 4), t: l.slice(5) }))

const ROUND = 10, LIVES = 3
const $ = id => document.getElementById(id)
const isVowel = c => 'AEIOU'.includes(c.normalize('NFD')[0])
// Compare letters only: accents, case, digits, spaces and punctuation don't matter.
const fold = s => s.normalize('NFD').replace(/\p{M}/gu, '').toUpperCase().replace(/[^A-Z]/g, '')
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} },
}

// Theme: light by default, the choice is remembered.
function setTheme(dark) {
  document.documentElement.classList.toggle('dark', dark)
  $('theme').textContent = dark ? '☀' : '☾'
  document.querySelector('meta[name=theme-color]').content = dark ? '#0f0f11' : '#ffffff'
}
setTheme(store.get('sf-dark', false))
$('theme').onclick = () => { const d = !document.documentElement.classList.contains('dark'); store.set('sf-dark', d); setTheme(d) }

// On-screen keyboard: the phone's own keyboard never opens, so the layout stays put.
const keys = s => [...s].map(k => `<button class="key" data-k="${k}">${k}</button>`).join('')
$('kb').innerHTML = [
  keys('QWERTYUIOP'),
  `<i class="sp"></i>${keys('ASDFGHJKL')}<i class="sp"></i>`,
  `<i class="sp"></i>${keys('ZXCVBNM')}<button class="key wide" data-k="back" aria-label="Sil">⌫</button>`,
  '<button class="key hint" data-k="hint" id="hint"></button><button class="key space" data-k=" ">boşluk</button><button class="key go" data-k="enter">Tahmin</button>',
].map(r => `<div class="kr">${r}</div>`).join('')

let round, idx, total, results, cur, typed = ''

// Prefer films not seen in earlier rounds; start over when too few are left.
function pickRound() {
  const seen = new Set(store.get('sf-seen', []))
  let pool = FILMS.filter(f => !seen.has(f.t))
  if (pool.length < ROUND) { seen.clear(); pool = FILMS.slice() }
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [pool[i], pool[j]] = [pool[j], pool[i]] }
  const r = pool.slice(0, ROUND)
  r.forEach(f => seen.add(f.t))
  store.set('sf-seen', [...seen])
  return r
}

function show(id) { for (const s of ['start', 'play', 'end']) $(s).hidden = s !== id }

function start() {
  round = pickRound(); idx = 0; total = 0; results = []
  show('play'); load()
}

function load() {
  const f = round[idx], chars = [...f.t.toUpperCase()]
  const vowels = chars.map((c, i) => isVowel(c) ? i : -1).filter(i => i >= 0)
  const letters = chars.filter(c => /\p{L}/u.test(c)).length
  // One letter per ~7 letters of title, at least one, never more than the vowels.
  const hints = Math.max(1, Math.min(vowels.length, Math.round(letters / 7)))
  cur = { f, chars, vowels, hints, used: 0, wrong: 0, shown: new Set(), done: false }
  setTyped('')
  $('kb').hidden = $('skip').hidden = false
  $('after').hidden = true
  $('answer').hidden = false
  msg('')
  render()
}

function render() {
  const s = cur
  let html = '<span class="w">'
  s.chars.forEach((c, i) => {
    if (c === ' ') html += '</span><span class="w">'
    else if (!isVowel(c)) html += c
    else if (s.shown.has(i)) html += `<span class="v">${c}</span>`
    else if (s.done) html += `<span class="${s.won ? 'v' : 'x'}">${c}</span>`
  })
  $('puzzle').innerHTML = html + '</span>'
  $('tag').textContent = `${s.f.y} · ${s.f.t.split(' ').length} kelime`
  $('pos').textContent = `${idx + 1}/${ROUND}`
  $('score').textContent = `${total} puan`
  $('prog').style.width = `${(idx + s.done) / ROUND * 100}%`
  $('hearts').innerHTML = Array.from({ length: LIVES }, (_, i) => `<i class="${i < LIVES - s.wrong ? '' : 'off'}"></i>`).join('')
  const left = s.hints - s.used
  $('hint').innerHTML = `Harf al<small>${left} hak</small>`
  $('hint').disabled = left <= 0
}

function setTyped(t) { typed = t.slice(0, 60); $('answer').textContent = typed }
function msg(t, cls = '') { $('msg').textContent = t; $('msg').className = cls }

function guess() {
  const g = fold(typed)
  if (!g) return
  if (g === fold(cur.f.t)) return finish(true)
  cur.wrong++
  setTyped('')
  const a = $('answer')
  a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake')
  if (cur.wrong >= LIVES) return finish(false)
  msg(`Olmadı · ${LIVES - cur.wrong} hakkın kaldı`, 'bad')
  render()
}

function hint() {
  const hidden = cur.vowels.filter(i => !cur.shown.has(i))
  if (cur.used >= cur.hints || !hidden.length) return
  cur.shown.add(hidden[Math.random() * hidden.length | 0])
  cur.used++
  render()
}

function finish(won) {
  const s = cur
  s.done = true; s.won = won
  const pts = won ? Math.max(10, 100 - 20 * s.used - 25 * s.wrong) : 0
  total += pts
  results.push({ t: s.f.t, pts })
  $('answer').hidden = true
  $('kb').hidden = $('skip').hidden = true
  $('after').hidden = false
  $('next').textContent = idx + 1 < ROUND ? 'Sonraki film →' : 'Sonucu gör →'
  msg(won ? `Bildin · +${pts} puan` : 'Bu sefer olmadı', won ? 'ok' : 'bad')
  render()
}

function next() { if (++idx < ROUND) load(); else end() }

function press(k) {
  if (!cur || cur.done) return
  if (k === 'enter') guess()
  else if (k === 'back') setTyped(typed.slice(0, -1))
  else if (k === 'hint') hint()
  else if (k === 'skip') finish(false)
  else if (k !== ' ' || (typed && !typed.endsWith(' '))) setTyped(typed + k.toUpperCase())
}

$('kb').onclick = e => { const b = e.target.closest('[data-k]'); if (b && !b.disabled) press(b.dataset.k) }
$('skip').onclick = () => press('skip')
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || $('play').hidden) return
  if (cur.done) { if (e.key === 'Enter') { e.preventDefault(); next() } return }
  const k = e.key === 'Enter' ? 'enter' : e.key === 'Backspace' ? 'back' : e.key === 'Escape' ? 'skip' : e.key.length === 1 ? e.key : null
  if (k) { e.preventDefault(); press(k) }
})

function end() {
  const best = Math.max(store.get('sf-best', 0), total)
  store.set('sf-best', best)
  $('total').textContent = `${total}`
  $('endbest').textContent = `puan · ${results.filter(r => r.pts).length}/${ROUND} film · en iyi ${best}`
  $('list').innerHTML = results.map(r => `<li><span>${r.pts ? '✓' : '✗'} ${r.t}</span><span class="mono">${r.pts ? '+' + r.pts : '—'}</span></li>`).join('')
  show('end')
}

const best = store.get('sf-best', 0)
if (best) $('best').textContent = `En iyi skorun ${best} / ${ROUND * 100}`
$('go').onclick = start
$('again').onclick = start
$('next').onclick = next
</script>
</body>
</html>
