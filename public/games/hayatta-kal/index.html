<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0b08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Hayatta Kal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700;900&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--s:min(42px,calc((100vw - 190px)/18.8))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0e0b08;color:#f0e6cf;font:18px/1.15 "Patrick Hand",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;padding:0;border:0;background:none}
img{display:block;pointer-events:none}
.ui{position:fixed;z-index:2}
.goth{font-family:"Grenze Gotisch",Georgia,serif}
.parch{background:radial-gradient(ellipse at 50% 35%,#f1e6ca,#d6c398);color:#2e2216;border:2px solid #7d6440;border-radius:5px;box-shadow:0 6px 22px #000c,inset 0 0 20px #a0814f99}
/* clock + badges */
#hud{top:calc(env(safe-area-inset-top) + 6px);right:calc(env(safe-area-inset-right) + 8px);display:grid;grid-template-columns:auto auto;gap:3px 4px;justify-items:center;pointer-events:none}
#clock{grid-column:span 2;width:68px;height:68px;border-radius:50%;position:relative;border:3px solid #120d09;box-shadow:0 2px 8px #000a}
#ring{position:absolute;inset:0;border-radius:50%}
#ring::after{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#120d09 0 .8deg,transparent .8deg 22.5deg)}
#hand{position:absolute;left:50%;top:0;width:6px;height:31px;margin-left:-3px;transform-origin:50% 100%;z-index:1}
#hand::before{content:'';position:absolute;left:0;top:0;width:6px;height:13px;background:#f3ead4;border:1.5px solid #120d09;border-radius:3px}
#day{position:absolute;inset:16px;border-radius:50%;background:radial-gradient(#3d2e20,#1a130c);display:grid;place-items:center;text-align:center;font-size:13px;line-height:.9;z-index:2;border:2px solid #120d09}
.badge{--p:100;--c:#c33;width:48px;height:48px;border-radius:50%;border:3px solid #120d09;position:relative;overflow:hidden;background:#231910;box-shadow:0 2px 6px #000a}
.badge::before{content:'';position:absolute;left:0;right:0;bottom:0;height:calc(var(--p)*1%);background:var(--c);transition:height .3s}
.badge img{position:absolute;inset:5px;width:32px;height:32px}
.badge b{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:14px;font-weight:400;text-shadow:0 0 3px #000,0 0 3px #000,0 0 3px #000}
.badge i{position:absolute;top:1px;left:0;right:0;text-align:center;font-style:normal;font-size:11px;color:#fff;text-shadow:0 0 3px #000}
.badge.low{animation:pulse .55s infinite alternate}
#bsan{grid-column:span 2;margin-top:-6px}
@keyframes pulse{to{filter:brightness(1.7)}}
/* inventory bar */
#bar{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 3px);display:flex;align-items:center;gap:3px;padding:4px 7px;background:linear-gradient(#2c2219f2,#140f0af2);border:2px solid #4d3e2c;border-radius:12px 12px 6px 6px;box-shadow:0 -2px 12px #0008}
.slot{width:var(--s);height:var(--s);border-radius:6px;background:radial-gradient(#3b3026,#1f1711);border:2px solid #6b5a43;position:relative;display:grid;place-items:center;overflow:hidden;flex:none}
.slot::before{content:'';position:absolute;left:0;right:0;bottom:0;height:var(--f,0%);background:var(--fc,transparent);opacity:.5}
.slot img{width:88%;height:88%;position:relative}
.slot b{position:absolute;right:2px;bottom:-1px;font-size:14px;font-weight:400;text-shadow:0 0 3px #000,0 0 3px #000,0 0 3px #000}
.slot i{position:absolute;left:3px;right:3px;top:2px;height:4px;border-radius:2px;background:#000a}
.slot i::after{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--d);background:#a5df5f;border-radius:2px}
.slot.sel{border-color:#f6e4a6;box-shadow:0 0 9px #f6e4a6}
.slot.eq{border-color:#9a8460;background:radial-gradient(#4a3a2a,#251b12)}
.slot.eq:empty::after{content:attr(data-ph);opacity:.22;font-size:calc(var(--s)*.5);filter:grayscale(1)}
.sep{width:6px;flex:none}
/* crafting */
#tabs{left:calc(env(safe-area-inset-left) + 6px);top:calc(env(safe-area-inset-top) + 6px);display:flex;flex-direction:column;gap:2px;padding:4px;background:linear-gradient(90deg,#2c2219f0,#18120cf0);border:2px solid #4d3e2c;border-radius:10px}
.tab{width:40px;height:min(36px,calc((100vh - 90px)/8.4));border-radius:7px;border:2px solid transparent;display:grid;place-items:center;position:relative}
.tab img{height:88%;width:auto;aspect-ratio:1}
.tab.on{background:#e8dbbd;border-color:#a88d5f}
.tab.has::after{content:'';position:absolute;right:1px;top:1px;width:8px;height:8px;border-radius:50%;background:#a5df5f;box-shadow:0 0 4px #a5df5f}
#rp{left:calc(env(safe-area-inset-left) + 62px);top:calc(env(safe-area-inset-top) + 6px);width:min(320px,52vw);max-height:calc(100vh - var(--s) - 30px);overflow:auto;padding:8px 10px;display:none}
#rp.on{display:block}
#rp h3{margin:0 0 6px;font:900 21px "Grenze Gotisch",serif;letter-spacing:.5px}
#rlist{display:flex;flex-wrap:wrap;gap:5px}
.ri{width:46px;height:46px;border-radius:7px;background:#00000018;border:2px solid #9c8259;display:grid;place-items:center;opacity:.5}
.ri img{width:40px;height:40px}
.ri.ok{opacity:1;border-color:#5f8a2c;background:#5f8a2c22}
.ri.kn{opacity:.85}
.ri.sel{outline:3px solid #2e2216;outline-offset:1px}
#rdet{margin-top:8px;border-top:1px dashed #8a6f48;padding-top:6px}
#rdet .nm{font:900 20px "Grenze Gotisch",serif}
#rdet .ds{font-size:15px;color:#5a4630;margin:2px 0 6px}
.ings{display:flex;gap:8px;flex-wrap:wrap}
.ing{display:flex;flex-direction:column;align-items:center;font-size:15px}
.ing img{width:34px;height:34px}
.ing.no{color:#a5261f}
.mk{margin-top:8px;width:100%;padding:7px;border-radius:6px;background:#5a3c22;color:#f3e7c9;border:2px solid #2e2216;font:900 19px "Grenze Gotisch",serif;letter-spacing:1px}
.mk:disabled{background:#8d7a5e;color:#d6c8aa}
/* action buttons */
#btns{right:calc(env(safe-area-inset-right) + 10px);bottom:calc(env(safe-area-inset-bottom) + var(--s) + 26px);display:flex;align-items:flex-end;gap:10px}
.rb{position:relative;border-radius:50%;border:3px solid #6b5a43;background:radial-gradient(#3e3227,#1a130d);display:grid;place-items:center;box-shadow:0 3px 10px #000b;touch-action:none}
.rb:active{transform:scale(.92);border-color:#d8c08a}
.rb span{font-size:30px;filter:drop-shadow(1px 1px 0 #000) drop-shadow(-1px -1px 0 #000) sepia(.3)}
.rb small{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:15px;text-shadow:0 0 3px #000,0 0 3px #000}
#bg{width:78px;height:78px}#bg span{font-size:36px}
#ba{width:58px;height:58px}
#mini{top:calc(env(safe-area-inset-top) + 6px);right:calc(env(safe-area-inset-right) + 126px);display:flex;gap:6px}
#mini button{width:40px;height:40px;border-radius:9px;border:2px solid #4d3e2c;background:#1f1711e6;font-size:20px}
/* popups */
#toast{top:calc(env(safe-area-inset-top) + 54px);left:50%;transform:translateX(-50%);font:900 26px "Grenze Gotisch",serif;letter-spacing:1px;text-shadow:0 2px 0 #000,0 0 12px #000;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#room{top:calc(env(safe-area-inset-top) + 50px);right:calc(env(safe-area-inset-right) + 126px);font-size:15px;padding:2px 8px;border-radius:7px;background:#000a;pointer-events:none}
#room:empty{display:none}
#rc{font:900 26px "Grenze Gotisch",serif;letter-spacing:4px;text-align:center;width:150px;padding:4px;border-radius:6px;border:2px solid #7d6440;background:#e8dbbd;color:#2e2216;text-transform:uppercase}
#hurt{inset:0;pointer-events:none;box-shadow:inset 0 0 100px 35px #b00;opacity:0}
#pop{display:none;flex-direction:column;gap:5px;padding:8px;min-width:160px;max-width:230px}
#pop.on{display:flex}
#pop .pt{font:900 18px "Grenze Gotisch",serif;text-align:center}
#pop .pd{font-size:15px;text-align:center;color:#5a4630}
#pop button{padding:6px;border-radius:6px;background:#5a3c22;color:#f3e7c9;border:2px solid #2e2216;font-size:17px}
#chest{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + var(--s) + 22px);padding:8px;display:none;text-align:center}
#chest.on{display:block}
#chest .g{display:grid;grid-template-columns:repeat(3,var(--s));gap:3px;margin-top:4px}
#mapw{inset:0;z-index:4;background:#000c;display:none;place-items:center}
#mapw.on{display:grid}
#mapc{border:4px solid #4d3e2c;border-radius:6px;box-shadow:0 0 40px #000}
#mapx{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:calc(env(safe-area-inset-right) + 14px);font-size:30px;text-shadow:0 0 4px #000}
/* menus */
#menu{inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;background:radial-gradient(circle at 50% 45%,#2e2318f2,#070504fc 75%)}
#menu.off{display:none}
#menu h1{margin:0;font:900 clamp(40px,11vmin,78px) "Grenze Gotisch",Georgia,serif;letter-spacing:2px;color:#ece0c4;text-shadow:3px 4px 0 #000,0 0 40px #8a2a1a77;transform:rotate(-3deg)}
#menu .sub{margin:-4px 0 6px;font-size:19px;color:#b8a582}
#mtext{font-size:19px;color:#e9a383;line-height:1.3}
#mbtns{display:flex;flex-direction:column;gap:2px}
#mbtns button{padding:6px 20px;font:900 28px "Grenze Gotisch",serif;letter-spacing:1px;color:#e8dbbd;text-shadow:0 3px 0 #000}
#mbtns button::before,#mbtns button::after{content:'~';opacity:.4;margin:0 10px}
#mbtns button:active{color:#fff;transform:scale(1.06)}
.help{font-size:15px;color:#a8977a;max-width:520px;line-height:1.35;margin-top:6px}
#rot{inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0e0b08;text-align:center;padding:30px}
#rot div{font-size:64px;animation:spin 2s ease-in-out infinite}
@keyframes spin{50%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="ui">
  <div id="clock"><div id="ring"></div><div id="hand"></div><div id="day" class="goth">Gün<br>1</div></div>
  <div class="badge" id="bhun" style="--c:#d98a2b"><img id="ihun" alt=""><i></i><b></b></div>
  <div class="badge" id="bhp" style="--c:#c23a2c"><img id="ihp" alt=""><i></i><b></b></div>
  <div class="badge" id="bsan" style="--c:#d9b23a"><img id="isan" alt=""><i></i><b></b></div>
</div>

<div id="btns" class="ui">
  <button class="rb" id="ba" aria-label="Saldır"><span>⚔️</span><small>Saldır</small></button>
  <button class="rb" id="bg" aria-label="Topla"><span>✋</span><small id="bgl">Topla</small></button>
</div>
<div id="toast" class="ui"></div>
<div id="room" class="ui"></div>
<div id="hurt" class="ui"></div>
<div id="pop" class="ui parch"></div>
<div id="chest" class="ui parch"><div class="goth" style="font-size:19px">Sandık</div><div class="g" id="cg"></div></div>
<div id="mapw" class="ui"><canvas id="mapc" style="position:static"></canvas><button id="mapx">✕</button></div>
<div id="menu" class="ui">
  <h1>Hayatta Kal</h1>
  <div class="sub">Aç kalma. Karanlıkta kalma.</div>
  <div id="mtext"></div>
  <div id="mbtns"></div>
  <div class="help">Sol tarafa dokunup sürükle: yürü · ✋ basılı tut: topla · ⚔️ saldır<br>Soldaki sekmelerden üret · eşyaya dokun: ye, kuşan, pişir, dik<br>Geceleri ateşin yanından ayrılma. Karanlıkta bir şey var.</div>
</div>
<div id="rot"><div>📱</div><div class="goth" style="font-size:28px">Telefonu yan çevir</div><div style="color:#a8977a">Hayatta Kal yatay ekranda oynanır.</div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),mctx=cv.getContext('2d'),lc=document.createElement('canvas'),lx=lc.getContext('2d');
let ctx=mctx,NOW=0;
const KEY='hayattakal-v2',BEST='hayattakal-best';
const T=64,W=90,WORLD=W*T,DAY=300,D1=9/16,D2=12/16,OUT='#120d09',LW=2.4,FONT='"Patrick Hand",sans-serif';
const clamp=(v,a,b)=>v<a?a:v>b?b:v,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),rnd=Math.random;
const setHTML=(el,h)=>{if(el._h!==h){el._h=h;el.innerHTML=h}};

// ================= data =================
const I={
  twigs:{n:'Dal',fuel:15},grass:{n:'Kesik Ot',fuel:15},log:{n:'Kütük',fuel:45},rock:{n:'Taş'},flint:{n:'Çakmaktaşı'},gold:{n:'Altın Külçe'},
  silk:{n:'İpek'},gland:{n:'Örümcek Bezi'},pigskin:{n:'Domuz Derisi'},ash:{n:'Kül'},rot:{n:'Çürük'},
  pinecone:{n:'Çam Kozalağı',plant:'tree',fuel:15,d:'Dikersen ağaç olur'},rope:{n:'Halat',fuel:20},boards:{n:'Tahta',fuel:60},
  petals:{n:'Taç Yaprağı',food:[0,1,0],per:6},
  berries:{n:'Böğürtlen',food:[9,0,0],per:6,cook:'cberries'},cberries:{n:'Közlenmiş Böğürtlen',food:[12,1,0],per:3},
  carrot:{n:'Havuç',food:[12,1,0],per:10,cook:'ccarrot'},ccarrot:{n:'Közlenmiş Havuç',food:[12,3,0],per:5},
  morsel:{n:'Et Parçası',food:[12,0,-10],per:6,cook:'cmorsel',meat:1},cmorsel:{n:'Pişmiş Et Parçası',food:[12,1,0],per:10,meat:1},
  meat:{n:'Çiğ Et',food:[25,1,-10],per:6,cook:'cmeat',meat:1},cmeat:{n:'Pişmiş Et',food:[25,3,0],per:10,meat:1},
  mmeat:{n:'Canavar Eti',food:[18,-20,-15],per:6,cook:'cmmeat',meat:1},cmmeat:{n:'Pişmiş Canavar Eti',food:[18,-3,-10],per:15,meat:1},
  salve:{n:'Merhem',heal:20,d:'Yaraları sarar: +20 sağlık'},
  grassp:{n:'Ot Tutamı',plant:'grass',d:'Üssüne dik'},saplingp:{n:'Fidan',plant:'sapling',d:'Üssüne dik'},berryp:{n:'Böğürtlen Çalısı',plant:'berry',d:'Üssüne dik'},
  trap:{n:'Tuzak',dur:8,plant:'trap',d:'Tavşan yakalar. Deliğin yanına kur.'},
  axe:{n:'Balta',slot:'hand',dur:60,dmg:27,d:'Ağaç keser'},pickaxe:{n:'Kazma',slot:'hand',dur:50,dmg:27,d:'Kaya kırar'},
  shovel:{n:'Kürek',slot:'hand',dur:25,dmg:17,d:'Kök söker, bitkileri kazar'},spear:{n:'Mızrak',slot:'hand',dur:100,dmg:34,d:'Sivri uçlu bir silah'},
  torch:{n:'Meşale',slot:'hand',dur:90,dmg:17,timed:1,d:'Taşınabilir ışık'},
  armor:{n:'Odun Zırh',slot:'body',dur:315,absorb:.8,d:'Hasarın %80ini emer'},
  helmet:{n:'Futbol Kaskı',slot:'head',dur:450,absorb:.8,d:'Kafanı korur (%80)'},
  garland:{n:'Çiçek Çelengi',slot:'head',dur:DAY*6,timed:1,san:.05,d:'Akla iyi gelir'},
  tophat:{n:'Silindir Şapka',slot:'head',dur:DAY*8,timed:1,san:.09,d:'Çok şık. Akla çok iyi gelir'},
  fire:{n:'Kamp Ateşi',d:'Işık ve pişirme. Yakıtı bitince söner.'},pit:{n:'Taş Ocak',d:'Sönse de yerinde kalır, tekrar yakılır.'},
  sci:{n:'Bilim Makinesi',d:'Yanındayken yeni tarifler öğrenirsin'},chest:{n:'Sandık',d:'9 yığın eşya saklar'},
};
const TABS=[['Araçlar','axe'],['Işık','torch'],['Hayatta Kalma','trap'],['Bilim','sci'],['Savaş','spear'],['Yapılar','chest'],['İşleme','rope'],['Giyim','tophat']];
const RECIPES=[
  {id:'axe',tab:0,req:{twigs:1,flint:1}},{id:'pickaxe',tab:0,req:{twigs:2,flint:2}},{id:'shovel',tab:0,req:{twigs:2,flint:2}},
  {id:'fire',tab:1,req:{grass:3,log:2}},{id:'pit',tab:1,req:{log:2,rock:12}},{id:'torch',tab:1,req:{grass:2,twigs:2}},
  {id:'trap',tab:2,req:{grass:6,twigs:2}},{id:'salve',tab:2,req:{ash:1,rock:1,gland:1},sci:1},
  {id:'sci',tab:3,req:{gold:1,log:4,rock:4}},
  {id:'spear',tab:4,req:{twigs:2,rope:1,flint:1},sci:1},{id:'armor',tab:4,req:{log:8,rope:2},sci:1},{id:'helmet',tab:4,req:{pigskin:1,rope:1},sci:1},
  {id:'chest',tab:5,req:{boards:3},sci:1},
  {id:'rope',tab:6,req:{grass:3}},{id:'boards',tab:6,req:{log:4},sci:1},
  {id:'garland',tab:7,req:{petals:12}},{id:'tophat',tab:7,req:{silk:6},sci:1},
];
const PLACE={fire:{fuel:90,max:180},pit:{fuel:120,max:240},sci:{},chest:{}};
const NAME={tree:'Çam Ağacı',stump:'Ağaç Kökü',sapling:'Fidan',grass:'Ot',berry:'Böğürtlen Çalısı',boulder:'Kaya',flint:'Çakmaktaşı',carrot:'Havuç',flower:'Çiçek',
  chest:'Sandık',trap:'Tuzak',pig:'Domuz Adam',phouse:'Domuz Evi',hole:'Tavşan Deliği',den:'Örümcek Yuvası',fire:'Kamp Ateşi',pit:'Taş Ocak',sci:'Bilim Makinesi',
  rabbit:'Tavşan',spider:'Örümcek',hound:'Tazı',shadow:'Kabus'};
const M={rabbit:{hp:25,spd:175,r:8},spider:{hp:100,spd:150,dmg:20,cd:3,reach:34,r:12,kill:'Örümcek',host:1},
  hound:{hp:150,spd:215,dmg:20,cd:2,reach:36,r:14,kill:'Tazı',host:1},shadow:{hp:80,spd:150,dmg:20,cd:2.5,reach:40,r:14,kill:'Kabus',host:1},
  pig:{hp:250,spd:180,dmg:33,cd:3,reach:38,r:12,kill:'Domuz Adam'}};
const SOLID={tree:13,boulder:18,den:26,sci:18,pit:22,fire:12,berry:10,phouse:24,chest:14};
const TOOL={tree:'axe',boulder:'pickaxe',stump:'shovel'};

// ================= world gen =================
function mulberry(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(i,j,s){let h=Math.imul(i|0,374761393)+Math.imul(j|0,668265263)+Math.imul(s|0,982451653)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
function vnoise(x,y,s){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),a=hash(i,j,s),b=hash(i+1,j,s),c=hash(i,j+1,s),d=hash(i+1,j+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const fbm=(x,y,s)=>vnoise(x,y,s)*.65+vnoise(x*2.1,y*2.1,s+7)*.35;
let bio,mini,seen;
function genBiomes(seed){
  bio=new Uint8Array(W*W);
  for(let j=0;j<W;j++)for(let i=0;i<W;i++){
    const d=Math.hypot(i-W/2+.5,j-W/2+.5)/(W/2);let b=0;
    if(d+(fbm(i/9,j/9,seed)-.5)*.5<.82){const f=fbm(i/11,j/11,seed+1),r=fbm(i/8,j/8,seed+2);b=r>.64?3:f>.56?2:f<.36?4:1}

  if(!G.dead){

    if(charlie>1.5&&charlie-dt<=1.5){say('Karanlık! Çok karanlık!');sfx('whisper')}

// ================= co-op =================
// A Durable Object at /api/room/<code> relays JSON between 2-4 players (worker/index.js in the site repo).
// The lowest player id is the host: it runs mobs, dens, holes, pig houses, hounds and shadows and streams them.
// Everyone simulates their own player, applies world edits locally and broadcasts the changed ents.
// ponytail: last write wins, so two players grabbing the same item in the same 100ms both get it.

      if(NET.host){if(!NET.create)return leaveCoop(`${NET.code} diye bir oda yok.`);newGame(Math.random()*1e9|0);start();toast(`Oda kodu: ${NET.code}`)}

    ctx.beginPath();ctx.moveTo(x-ww,y);ctx.quadraticCurveTo(x-ww*1.1,y-hh*.6,x+Math.sin(t*.7+k)*2.5,y-hh*1.35);ctx.quadraticCurveTo(x+ww*1.1,y-hh*.6,x+ww,y);ctx.fillStyle=c;ctx.fill()}}

  }
  const f=it.food,fs=s.p!=null?(s.p<.2?' · çürüyor':s.p<.5?' · bayat':' · taze'):'';
  const desc=f?`🍖${f[0]>=0?'+':''}${f[0]} ❤️${f[1]>=0?'+':''}${f[1]} 🧠${f[2]>=0?'+':''}${f[2]}${fs}`:(it.d||'')+(it.fuel&&pit?` (yakıt +${it.fuel})`:'');
  const pop=$('pop');pop.innerHTML=`<div class="pt">${it.n}</div>${desc?`<div class="pd">${desc}</div>`:''}`+acts.map((a,k)=>`<button data-k="${k}">${a[0]}</button>`).join('');
  pop.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;acts[+b.dataset.k][1]();closePop()};
  closePop();popSel=sl?`[data-s="${sl}"]`:`[data-i="${i}"]`;el.classList.add('sel');
  pop.classList.add('on');const r=el.getBoundingClientRect(),pr=pop.getBoundingClientRect();
  pop.style.left=clamp(r.left+r.width/2-pr.width/2,6,VW-pr.width-6)+'px';pop.style.top=Math.max(6,r.top-pr.height-8)+'px';
}
$('bar').addEventListener('click',e=>{const el=e.target.closest('.slot');if(!el||!G||G.dead)return;if(popSel&&el.matches(popSel))return closePop();openPop(el)});
function renderChest(){const c=$('chest');if(!openC){c.classList.remove('on');return}c.classList.add('on');setHTML($('cg'),openC.inv.map((s,i)=>slotHTML(s,`data-c="${i}"`)).join(''))}
$('cg').addEventListener('click',e=>{const el=e.target.closest('.slot');if(!el||!openC)return;const i=+el.dataset.c,s=openC.inv[i];if(!s)return;const l=addTo(G.p.inv,s.id,s.n,s.d,s.p);if(l){s.n=l;say('Daha fazla taşıyamam.')}else openC.inv[i]=null;invDirty=true;dirty(openC);renderChest()});
function holdBtn(el,mode){
  el.addEventListener('pointerdown',e=>{e.preventDefault();audio();closePop();act.mode=mode;act.held=true;goal=null;try{el.setPointerCapture(e.pointerId)}catch{}});
  const up=()=>{if(act.mode===mode)act.held=false};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}
holdBtn($('bg'),'g');holdBtn($('ba'),'a');
cv.addEventListener('pointerdown',e=>{audio();closePop();if(selTab>=0){selTab=-1;renderTabs();renderCraft()}
  if(joy.id===null&&e.clientX<VW*.65){joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.x=joy.y=0;cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const d=Math.hypot(dx,dy);if(d>50){dx*=50/d;dy*=50/d}joy.x=dx/50;joy.y=dy/50});
const joyUp=e=>{if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0}};cv.addEventListener('pointerup',joyUp);cv.addEventListener('pointercancel',joyUp);
addEventListener('contextmenu',e=>e.preventDefault());
const KM={KeyW:'w',ArrowUp:'w',KeyA:'a',ArrowLeft:'a',KeyS:'s',ArrowDown:'s',KeyD:'d',ArrowRight:'d'};
function key(e,v){if(!G)return;audio();if(KM[e.code])K[KM[e.code]]=v;
  else if(e.code==='Space'||e.code==='KeyF'){const m=e.code==='Space'?'g':'a';if(v&&!e.repeat){act.mode=m;act.held=true;goal=null}else if(!v&&act.mode===m)act.held=false}
  else if(v&&e.code==='KeyM')toggleMap();else if(v&&e.code==='Escape')pause()}
addEventListener('keydown',e=>key(e,1));addEventListener('keyup',e=>key(e,0));
addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('pagehide',save);
function toggleMap(){if($('mapw').classList.toggle('on')){paused=true;drawMap()}else paused=false}
function drawMap(){
  const c=$('mapc'),sz=Math.min(VW-40,VH-30)|0,g=c.getContext('2d'),t=sz/W;c.style.width=c.style.height=sz+'px';c.width=c.height=sz*DPR;g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#d8c69d';g.fillRect(0,0,sz,sz);
  const COL=['#6b8a90','#98a463','#64764a','#a39782','#c5b676'];
  for(let k=0;k<W*W;k++)if(seen[k]){g.fillStyle=COL[bio[k]];g.fillRect((k%W)*t,(k/W|0)*t,t+.6,t+.6)}
  const MI={fire:'fire',pit:'fire',sci:'sci',chest:'chest',phouse:'pigskin',den:'silk',hole:'carrot'};
  for(const e of G.ents){const ic=MI[e.t];if(ic&&seen[(e.y/T|0)*W+(e.x/T|0)])g.drawImage(icon(ic),e.x/T*t-9,e.y/T*t-9,18,18)}
  const px=G.p.x/T*t,py=G.p.y/T*t;g.fillStyle='#c22';g.strokeStyle='#000';g.lineWidth=2;g.beginPath();g.arc(px,py,6,0,7);g.fill();g.stroke();
  const vg=g.createRadialGradient(sz/2,sz/2,sz*.35,sz/2,sz/2,sz*.75);vg.addColorStop(0,'rgba(80,50,20,0)');vg.addColorStop(1,'rgba(80,50,20,.45)');g.fillStyle=vg;g.fillRect(0,0,sz,sz);
}
$('bmap').addEventListener('click',()=>{if(G&&!G.dead)toggleMap()});$('mapx').addEventListener('click',toggleMap);
function pause(){if(!G||G.dead)return;save();showMenu(NET?`Oda ${NET.code} (oyun devam ediyor)`:'Duraklatıldı','pause')}
$('bpause').addEventListener('click',pause);

function showMenu(msg,mode){
  paused=true;let saved=null;try{saved=mode!=='dead'&&localStorage.getItem(KEY)}catch{}
  $('mtext').innerHTML=msg||'';const btns=[];
  if(mode==='pause')btns.push(['Devam Et',()=>{$('menu').classList.add('off');paused=false}],NET?['Odadan Çık',()=>leaveCoop()]:['Kaydet ve Çık',()=>{save();G=null;showMenu('Kaydedildi.')}]);
  else if(mode==='net')btns.push(['Yeniden Doğ',()=>{const a=Object.values(PE).find(q=>!q.dead)||G.p;G.p=newP(a.x,a.y);G.dead=0;start()}],['Odadan Çık',()=>leaveCoop()]);
  else if(mode==='join'){$('mtext').innerHTML='<input id="rc" maxlength="8" placeholder="KOD" autocomplete="off">';
    btns.push(['Katıl',()=>{const c=$('rc').value.trim().toUpperCase();if(ROOM.test(c))coop(c,0)}],['Geri',()=>showMenu()])}
  else{
    if(saved)btns.push(['Devam Et',()=>{G=JSON.parse(saved);genBiomes(G.seed);seen=new Uint8Array(W*W);for(let k=0;k<G.seen.length;k++)seen[k]=G.seen.charCodeAt(k)-48;start()}]);
    btns.push([mode==='dead'?'Yeniden Dene':'Yeni Dünya',()=>{newGame(Math.random()*1e9|0);start()}]);
    btns.push(['Oda Kur (2-4 kişi)',()=>coop(Array.from({length:4},()=>'ABCDEFGHJKLMNPRSTUVYZ'[rnd()*21|0]).join(''),1)],['Odaya Katıl',()=>showMenu('','join')]);
  }
  $('mbtns').innerHTML=btns.map((b,k)=>`<button data-k="${k}">${b[0]}</button>`).join('');
  $('mbtns').onclick=e=>{const b=e.target.closest('button');if(b){audio();btns[+b.dataset.k][1]()}};
  $('menu').classList.remove('off');
  const rc=$('rc');if(rc)rc.focus();
}
function start(){
  try{const d=document.documentElement;if(matchMedia('(pointer:coarse)').matches&&d.requestFullscreen&&!document.fullscreenElement)
    d.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{})}catch{}
  $('menu').classList.add('off');paused=false;cam.x=G.p.x;cam.y=G.p.y;goal=null;hov=null;act.mode=null;charlie=0;openC=null;selTab=-1;idCache=new Map();
  invDirty=true;renderChest();renderCraft();SCI=G.ents.some(e=>e.t==='sci'&&dist(e,G.p)<260);save();
}
let last=0,hovT=0;
function frame(t){
  requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;NOW=t/1000;
  if(!G)return;
  if(NET||(!G.dead&&!paused&&VW>=VH)){
    update(dt);
    if((hovT+=dt)>.15){hovT=0;hov=findTarget('g',true)}
    if(rnd()<dt*6&&FR.lights.some(l=>l.fire&&Math.hypot(l.x-G.p.x,l.y-G.p.y)<300))sfx('fire');
  }
  if(NET&&(netT+=dt)>.1){netT=0;netTick()}
  render();
  if(invDirty)renderInv();
  if((hudT+=dt)>.2){hudT=0;hud()}
}
let best=0;try{best=+localStorage.getItem(BEST)||0}catch{}
showMenu(best?`En iyi: ${best} gün`:'');
if(ROOM.test(location.hash.slice(1).toUpperCase()))coop(location.hash.slice(1).toUpperCase(),0);
requestAnimationFrame(frame);
</script>
</body>
</html>
