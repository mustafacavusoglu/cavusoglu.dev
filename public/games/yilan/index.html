<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kokpit Yılan</title>
<style>
:root{--dash:max(150px,24vh);--c:#6ff;--warn:#ff4060;--food:#ff4fd8}
html,body{margin:0;height:100%;overflow:hidden;background:#02040a;color:var(--c);font:14px/1.3 ui-monospace,Menlo,Consolas,monospace}
#view{position:fixed;left:0;right:0;top:0;bottom:var(--dash);overflow:hidden}
#view canvas{position:absolute;inset:0}
#canopy,#cross,#mark,#arrow,#warn{position:absolute;pointer-events:none}
#canopy{inset:0;width:100%;height:100%}
#cross{left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%)}
#mark{width:34px;height:34px;border:2px solid var(--food);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 12px var(--food);display:none}
#arrow{left:50%;top:50%;width:0;height:0;border-left:22px solid var(--food);border-top:12px solid transparent;border-bottom:12px solid transparent;display:none;filter:drop-shadow(0 0 6px var(--food))}
#warn{top:16%;left:50%;transform:translateX(-50%);color:var(--warn);font-size:22px;font-weight:bold;letter-spacing:3px;display:none;animation:blink .4s steps(2) infinite;text-shadow:0 0 10px var(--warn)}
@keyframes blink{50%{opacity:0}}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(2,4,10,.65);cursor:pointer;padding:16px}
#msg h1{margin:0 0 12px;font-size:clamp(28px,6vw,56px);letter-spacing:6px;text-shadow:0 0 18px var(--c)}
#msg p{margin:4px}
#msg b{color:#fff}
#dash{position:fixed;left:0;right:0;bottom:0;height:var(--dash);display:flex;gap:12px;padding:10px 16px;box-sizing:border-box;border-top:2px solid #1d3b55;background:linear-gradient(#0d1729,#04070d)}
.panel{flex:1;position:relative;border:1px solid #1d3b55;border-radius:10px;background:#060b16;overflow:hidden;box-shadow:inset 0 0 20px #000}
.panel canvas{position:absolute;inset:0}
.lbl{font-size:11px;opacity:.7;letter-spacing:2px}
#mini .lbl,#radarP .lbl{position:absolute;top:6px;left:10px;z-index:1}
#inst{flex:1.4;display:grid;grid-template-columns:repeat(3,1fr);align-content:center;gap:8px 12px;padding:8px 14px}
#inst b{display:block;font-size:clamp(16px,2.4vw,28px);color:#fff;text-shadow:0 0 8px var(--c)}
#radar{margin:auto;height:92%;width:auto;aspect-ratio:1}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="view">
  <svg id="canopy" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path d="M0 0H100V6Q50 1 0 6Z M0 0H9L3 100H0Z M100 0H91L97 100H100Z" fill="#0a1220" stroke="#2a5a80" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
  </svg>
  <svg id="cross" viewBox="-32 -32 64 64"><g stroke="#6ff" stroke-width="1.5" fill="none" opacity=".8"><circle r="6"/><path d="M-26 0H-12M12 0H26M0 -6V-14"/></g></svg>
  <div id="mark"></div>
  <div id="arrow"></div>
  <div id="warn"></div>
  <div id="msg"></div>
</div>
<div id="dash">
  <div class="panel" id="mini"><span class="lbl">HARİTA</span></div>
  <div class="panel" id="inst">
    <div><span class="lbl">SKOR</span><b id="score">0</b></div>
    <div><span class="lbl">EN İYİ</span><b id="best">0</b></div>
    <div><span class="lbl">UZUNLUK</span><b id="len">0</b></div>
    <div><span class="lbl">HIZ</span><b id="spd">0</b></div>
    <div><span class="lbl">ÖNÜ AÇIK</span><b id="ahead">0</b></div>
    <div><span class="lbl">YEM MESAFE</span><b id="fd">0</b></div>
  </div>
  <div class="panel" id="radarP" style="display:flex"><span class="lbl">RADAR</span><canvas id="radar" width="160" height="160" style="position:static"></canvas></div>
</div>

<script type="module">
import * as THREE from 'three';
const $ = id => document.getElementById(id);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const N = 15, C = (N - 1) / 2;

// --- renderers: main cockpit view + dashboard minimap
const view = $('view'), miniEl = $('mini');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.prepend(renderer.domElement);
const miniR = new THREE.WebGLRenderer({ antialias: true, alpha: true });
miniR.setPixelRatio(Math.min(devicePixelRatio, 2));
miniEl.append(miniR.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color(0x02040a);
const fog = new THREE.Fog(0x02040a, 3, N * 1.5);
scene.background = BG; scene.fog = fog;

// layers: 0 shared, 1 minimap only, 2 cockpit only
const camera = new THREE.PerspectiveCamera(75, 1, 0.05, 100);
camera.layers.enable(2);
const miniCam = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
miniCam.layers.enable(1);
miniCam.position.set(C + N * 1.5, C + N * 1.3, C + N * 2);
miniCam.lookAt(C, C, C);

scene.add(new THREE.HemisphereLight(0x88bbff, 0x223344, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(1, 2, 1.5);
scene.add(sun);

// arena walls: each one a different colour so the pilot can tell up from down
const wallCols = [[0xffaa00, 0xffdd55], [0x00ff88, 0x3399ff], [0xaa66ff, 0x66ffff]];
for (const axis of [0, 1, 2]) for (const s of [0, 1]) {
  const col = wallCols[axis][s];
  const g = new THREE.GridHelper(N, N, col, col);
  g.material.transparent = true; g.material.opacity = 0.4;
  const p = new THREE.Mesh(new THREE.PlaneGeometry(N, N).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.05, side: THREE.DoubleSide, depthWrite: false }));
  const grp = new THREE.Group().add(g, p);
  if (axis === 0) grp.rotation.z = Math.PI / 2;
  if (axis === 2) grp.rotation.x = Math.PI / 2;
  grp.position.set(C, C, C).setComponent(axis, s ? N - 0.5 : -0.5);
  scene.add(grp);
}

// floating dust for a sense of speed (cockpit only)
const dustPos = new Float32Array(900 * 3).map(() => Math.random() * N - 0.5);
const dust = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(dustPos, 3)),
  new THREE.PointsMaterial({ color: 0x99ccff, size: 0.04 }));
dust.layers.set(2);
scene.add(dust);

const segGeo = new THREE.BoxGeometry(0.82, 0.82, 0.82);
const segMats = [0x22ff77, 0x11bb55].map(c => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.25, roughness: 0.4 }));
const segs = [];
const seg = i => { while (segs.length <= i) { const m = new THREE.Mesh(segGeo, segMats[segs.length % 2]); scene.add(m); segs.push(m); } };

const food = new THREE.Mesh(new THREE.IcosahedronGeometry(0.38, 0),
  new THREE.MeshStandardMaterial({ color: 0xff4fd8, emissive: 0xff2fb0, emissiveIntensity: 1.2, flatShading: true }));
food.add(new THREE.PointLight(0xff4fd8, 6, 7, 1.5));
scene.add(food);

const marker = new THREE.Mesh(new THREE.ConeGeometry(0.6, 1.6, 10).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffff66 }));
marker.layers.set(1);
scene.add(marker);

// --- game state
let snake, prev, f, u, queue, score, stepTime, acc, shake, state = 'menu';
let best = 0;
try { best = +localStorage.getItem('kokpitYilanBest') || 0; } catch {}

const _m = new THREE.Matrix4();
const basisQ = (f, u) => new THREE.Quaternion().setFromRotationMatrix(_m.makeBasis(f.clone().cross(u), u, f.clone().negate()));
const out = p => [p.x, p.y, p.z].some(c => c < 0 || c >= N);
const onSnake = p => snake.some(s => s.equals(p));

// turns are relative to the pilot: f = nose, u = canopy top, f×u = right wing
const turn = {
  left() { f = u.clone().cross(f); },
  right() { f = f.clone().cross(u); },
  up() { [f, u] = [u.clone(), f.clone().negate()]; },
  down() { [f, u] = [u.clone().negate(), f.clone()]; },
};

function placeFood() {
  do food.position.set(...[0, 0, 0].map(() => Math.floor(Math.random() * N)));
  while (onSnake(food.position));
}

function reset() {
  f = V(0, 0, -1); u = V(0, 1, 0);
  snake = [V(7, 7, 11), V(7, 7, 12), V(7, 7, 13)];
  prev = snake.map(p => p.clone());
  queue = []; score = 0; stepTime = 0.32; acc = 0; shake = 0;
  camera.quaternion.copy(basisQ(f, u));
  placeFood();
}

function tick() {
  if (queue.length) turn[queue.shift()]();
  const h = snake[0].clone().add(f);
  const eat = h.equals(food.position);
  const body = eat ? snake : snake.slice(0, -1);
  if (out(h) || body.some(p => p.equals(h))) return die();
  prev = snake.map(p => p.clone());
  snake.unshift(h);
  if (eat) { score++; stepTime = Math.max(0.12, stepTime * 0.95); placeFood(); }
  else snake.pop();
}

const msg = $('msg');
const show = html => { msg.innerHTML = html; msg.style.display = 'flex'; };
const CONTROLS = '<p>W / S · ↑ ↓ — burun yukarı / aşağı</p><p>A / D · ← → — sola / sağa dön</p><p>Q / E — sola / sağa yuvarlan (roll)</p><p>P — duraklat</p>';

function die() {
  state = 'over'; shake = 0.6;
  if (score > best) { best = score; try { localStorage.setItem('kokpitYilanBest', best); } catch {} }
  show(`<h1>ÇARPTIN!</h1><p>Skor: <b>${score}</b> · En iyi: <b>${best}</b></p><p style="margin-top:16px"><b>BOŞLUK</b> ile tekrar kalkış</p>`);
}
function start() { reset(); state = 'play'; msg.style.display = 'none'; }
function resume() { state = 'play'; msg.style.display = 'none'; }
msg.onclick = () => state === 'pause' ? resume() : start();

const keyMap = { KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right' };
addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.code;
  if (k === 'Space' || k === 'Enter') { e.preventDefault(); state === 'pause' ? resume() : state !== 'play' && start(); return; }
  if (k === 'KeyP' || k === 'Escape') {
    if (state === 'play') { state = 'pause'; show('<h1>DURAKLATILDI</h1>' + CONTROLS + '<p style="margin-top:16px"><b>BOŞLUK</b> ile devam</p>'); }
    else if (state === 'pause') resume();
    return;
  }
  if (state !== 'play') return;
  // roll doesn't change the path, so it's applied instantly
  if (k === 'KeyQ') { u = u.clone().cross(f); return; }
  if (k === 'KeyE') { u = f.clone().cross(u); return; }
  const t = keyMap[k];
  if (t) { e.preventDefault(); if (queue.length < 3) queue.push(t); }
});

// --- HUD
const rc = $('radar').getContext('2d');
function radar(lp) {
  const R = 70, s = R / N;
  rc.clearRect(0, 0, 160, 160);
  rc.save(); rc.translate(80, 80);
  rc.strokeStyle = '#1d5a7a'; rc.lineWidth = 1;
  for (const r of [R / 3, 2 * R / 3, R]) { rc.beginPath(); rc.arc(0, 0, r, 0, 7); rc.stroke(); }
  rc.beginPath(); rc.moveTo(-R, 0); rc.lineTo(R, 0); rc.moveTo(0, -R); rc.lineTo(0, R); rc.stroke();
  rc.fillStyle = '#6ff';
  rc.beginPath(); rc.moveTo(0, -7); rc.lineTo(5, 5); rc.lineTo(-5, 5); rc.fill();
  let x = lp.x * s, y = lp.z * s;
  const d = Math.hypot(x, y);
  if (d > R) { x *= R / d; y *= R / d; }
  rc.fillStyle = '#ff4fd8'; rc.shadowColor = '#ff4fd8'; rc.shadowBlur = 10;
  rc.beginPath(); rc.arc(x, y, 6, 0, 7); rc.fill();
  rc.shadowBlur = 0; rc.font = 'bold 13px monospace'; rc.textAlign = 'center';
  const h = Math.round(lp.y);
  if (h) rc.fillText((h > 0 ? '▲' : '▼') + Math.abs(h), x, y - 10);
  rc.restore();
}

function clearAhead() {
  const p = snake[0].clone();
  let k = 0;
  while (!out(p.add(f)) && !onSnake(p)) k++;
  return k;
}

function hud() {
  camera.updateMatrixWorld();
  const lp = food.position.clone().applyMatrix4(camera.matrixWorldInverse);
  const p = food.position.clone().project(camera);
  const W = view.clientWidth, H = view.clientHeight;
  const onScreen = lp.z < 0 && Math.abs(p.x) < 0.92 && Math.abs(p.y) < 0.92;
  const mark = $('mark'), arrow = $('arrow');
  mark.style.display = onScreen ? 'block' : 'none';
  arrow.style.display = onScreen || state !== 'play' ? 'none' : 'block';
  if (onScreen) { mark.style.left = (p.x + 1) / 2 * W + 'px'; mark.style.top = (1 - p.y) / 2 * H + 'px'; }
  else {
    const ang = Math.atan2(-lp.y, lp.x), r = Math.min(W, H) * 0.38;
    arrow.style.transform = `translate(${Math.cos(ang) * r}px,${Math.sin(ang) * r}px) translate(-50%,-50%) rotate(${ang}rad)`;
  }
  radar(lp);

  const ah = clearAhead(), warn = $('warn');
  warn.style.display = state === 'play' && ah <= 1 ? 'block' : 'none';
  warn.textContent = ah === 0 ? '⚠ ÇARPIŞMA!' : '⚠ DİKKAT: ENGEL';
  $('score').textContent = score;
  $('best').textContent = best;
  $('len').textContent = snake.length;
  $('spd').textContent = (1 / stepTime).toFixed(1);
  $('ahead').textContent = ah;
  $('fd').textContent = snake[0].manhattanDistanceTo(food.position);
}

function resize() {
  const W = view.clientWidth, H = view.clientHeight;
  renderer.setSize(W, H); camera.aspect = W / H; camera.updateProjectionMatrix();
  const mw = miniEl.clientWidth, mh = miniEl.clientHeight;
  miniR.setSize(mw, mh); miniCam.aspect = mw / mh; miniCam.updateProjectionMatrix();
}
addEventListener('resize', resize);

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') {
    acc += dt;
    while (acc >= stepTime && state === 'play') { acc -= stepTime; tick(); }
  }
  const a = state === 'over' ? 1 : acc / stepTime;

  seg(snake.length);
  segs.forEach((m, i) => {
    m.visible = i > 0 && i < snake.length; // segment 0 is the cockpit itself
    if (m.visible) m.position.lerpVectors(prev[Math.min(i, prev.length - 1)], snake[i], a);
  });

  const tq = basisQ(f, u);
  camera.position.lerpVectors(prev[0], snake[0], a);
  camera.quaternion.slerp(tq, 1 - Math.exp(-dt * 12));
  if (shake > 0) {
    shake -= dt;
    camera.position.add(V(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(shake * 0.5));
  }
  marker.position.copy(camera.position);
  marker.quaternion.copy(tq);
  food.rotation.x += dt; food.rotation.y += dt * 1.3;
  food.scale.setScalar(1 + Math.sin(now / 200) * 0.12);

  hud();
  renderer.render(scene, camera);
  scene.fog = null; scene.background = null;
  miniR.render(scene, miniCam);
  scene.fog = fog; scene.background = BG;
}

reset();
resize();
show('<h1>KOKPİT YILAN</h1><p>Yılanın içindesin — pilot sensin.</p><p style="margin-bottom:12px">Pembe yemleri topla, duvarlara ve kendi kuyruğuna çarpma.</p>' + CONTROLS + '<p style="margin-top:16px"><b>BOŞLUK</b> ile kalkış</p>');
requestAnimationFrame(frame);
</script>
</body>
</html>
